apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            {{- if .Values.env.JAVA_TOOL_OPTIONS }}
            - name: JAVA_TOOL_OPTIONS
              value: "{{ .Values.env.JAVA_TOOL_OPTIONS }}"
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if .Values.adImages }}
          volumeMounts:
            - name: ad-images
              mountPath: {{ .Values.adImages.mountPath }}
          {{- end }}
      {{- if .Values.adImages }}
      volumes:
        # 광고 배너 이미지 저장소. 파드 로컬 디스크면 레플리카끼리 안 보이고 재배포 시 사라지므로
        # 노드(hoya) 호스트 디렉터리를 모든 레플리카가 공유한다.
        - name: ad-images
          hostPath:
            path: {{ .Values.adImages.hostPath }}
            type: DirectoryOrCreate
      {{- end }}
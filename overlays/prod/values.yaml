replicaCount: 2

image:
  repository: parkjeongho/practicket
  pullPolicy: IfNotPresent
  tag: "20260925035830"
env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=70.0 -XX:MaxMetaspaceSize=256m"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 3Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# 운영 중 쌓이는 파일: 호스트 디렉터리를 레플리카가 공유 (하위에 ad-images, blog-images)
appData:
  hostPath: /data/practicket
  mountPath: /data/practicket

replicaCount: 2

image:
  repository: parkjeongho/practicket-stage
  pullPolicy: IfNotPresent
  tag: "20260821053058"

env:
  SPRING_PROFILES_ACTIVE: "stage"
  JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=256m"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# 광고 배너 이미지: stage는 호스트 경로를 분리해 prod 이미지와 섞이지 않게 한다
adImages:
  hostPath: /data/stage-practicket/ad-images
  mountPath: /data/practicket/ad-images

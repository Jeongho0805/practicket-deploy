replicaCount: 2

image:
  repository: parkjeongho/practicket-stage
  pullPolicy: IfNotPresent
  tag: "20260911080359"

env:
  SPRING_PROFILES_ACTIVE: "stage"
  JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=60.0 -XX:MaxMetaspaceSize=256m"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# 운영 중 쌓이는 파일: stage는 호스트 경로를 분리해 prod 파일과 섞이지 않게 한다.
# 호스트 경로는 다르지만 파드 안에서는 prod 와 같은 경로로 보여 앱 설정이 갈리지 않는다.
appData:
  hostPath: /data/stage-practicket
  mountPath: /data/practicket
